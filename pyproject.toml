[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jtagconn"
version = "0.1.0"
description = "C2000 JTAG Debug Desktop App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "pyelftools",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
]

[project.scripts]
jtagconn = "jtagconn.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hw: hardware in the loop tests",
]
addopts = "-m 'not hw' -p no:pytest-qt"

[tool.ruff]
line-length = 100
