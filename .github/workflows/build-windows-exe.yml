name: Build Windows EXE

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q

      - name: Build single-file EXE
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          python -m PyInstaller --clean --noconfirm packaging/jtagconn.spec

      - name: Build installer (if Inno Setup available)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "packaging\installer.iss"
          } elseif (Get-Command ISCC.exe -ErrorAction SilentlyContinue) {
            ISCC.exe "packaging\installer.iss"
          } else {
            Write-Warning "Inno Setup not found; skipping setup build."
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: JTAG-conn-exe
          path: dist/JTAG-conn.exe
          if-no-files-found: error

      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: JTAG-conn-setup
          path: dist/JTAG-conn-Setup.exe
          if-no-files-found: warn
